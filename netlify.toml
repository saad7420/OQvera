# Saad Mehmood — portfolio. Netlify runs `node build.js`, publishes /site,
# and deploys the chat assistant from netlify/functions.
[build]
  command = "node build.js"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# old OQVERA address keeps working
[[redirects]]
  from = "/project-content-creation-pipeline.html"
  to = "/case-studies/content-creation-pipeline.html"
  status = 301

[[redirects]]
  from = "/saadi"
  to = "/saadi/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# private finance app: never indexed, never framed, never cached
[[headers]]
  for = "/saadi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
